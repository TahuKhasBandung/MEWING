global       
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 1d

    tune.h2.initial-window-size 2147483647
    tune.ssl.default-dh-param 2048

    pidfile /run/haproxy.pid
    chroot /var/lib/haproxy

    user haproxy
    group haproxy
    daemon

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    option dontlognull
    timeout connect 5s
    timeout client  300s
    timeout server  300s

# ============================================================
# Frontend: Multiport (Non-SSL ports)
# Terima koneksi TCP pada port 222-442, 444-999 (exclude 443)
# Deteksi apakah TLS atau non-TLS, lalu route
# ============================================================
frontend multiport
    mode tcp
    bind *:222-442 tfo
    bind *:444-999 tfo
    bind *:8443 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend recir_http if HTTP
    default_backend recir_https

# ============================================================
# Frontend: SSL Termination (port 443)
# Terminasi TLS, lalu route berdasarkan protocol
# ============================================================
frontend ft_ssl
    mode tcp
    bind *:443 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if { req.ssl_hello_type 1 }
    default_backend recir_https

# ============================================================
# Frontend: Non-SSL HTTP ports (80, 8080, 8880, 55)
# Terima koneksi langsung (non-SSL) dan route ke HTTP handler
# ============================================================
frontend ft_http_direct
    mode tcp
    bind *:80 tfo
    bind *:55 tfo
    bind *:8080 tfo
    bind *:8880 tfo
    tcp-request inspect-delay 500ms
    tcp-request content accept if HTTP
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend bk_nginx_http if HTTP
    default_backend bk_openvpn

# ============================================================
# Frontend: HTTPS termination via abstract namespace socket
# Setelah TLS di-terminasi, traffic HTTP/H2 di-routing di sini
# ============================================================
frontend ft_https_terminated
    mode http
    bind abns@haproxy-https accept-proxy ssl crt /etc/haproxy/hap.pem alpn h2,http/1.1

    # gRPC routing (via h2 ALPN)
    acl is_grpc_vless path_beg /vless-grpc
    acl is_grpc_vmess path_beg /vmess-grpc
    acl is_grpc_trojan path_beg /trojan-grpc
    acl is_grpc_ss path_beg /ss-grpc
    acl is_grpc or is_grpc_vless is_grpc_vmess is_grpc_trojan is_grpc_ss

    # WebSocket routing
    acl is_websocket hdr(Connection) -i upgrade
    acl is_ws_upgrade hdr(Upgrade) -i websocket

    # SSH payload detection (SSH-2.0 = hex 5353482d322e30)
    acl is_ssh_payload req.payload(0,7) -m bin 5353482d322e30

    use_backend bk_nginx_grpc if is_grpc
    use_backend bk_nginx_ws if is_websocket is_ws_upgrade
    use_backend bk_nginx_ws if { path_beg / }
    default_backend bk_nginx_ws

# ============================================================
# Frontend: HTTP plaintext via abstract namespace socket
# ============================================================
frontend ft_http_terminated
    mode http
    bind abns@haproxy-http accept-proxy

    # WebSocket routing
    acl is_websocket hdr(Connection) -i upgrade
    acl is_ws_upgrade hdr(Upgrade) -i websocket

    use_backend bk_nginx_ws if is_websocket is_ws_upgrade
    default_backend bk_nginx_ws

# ============================================================
# BACKENDS
# ============================================================

# Nginx WS handler (port 1010) - handles Xray WS + SSH WS
backend bk_nginx_ws
    mode http
    server nginx-ws 127.0.0.1:1010 send-proxy check

# Nginx gRPC handler (port 1013) - handles Xray gRPC
backend bk_nginx_grpc
    mode http
    server nginx-grpc 127.0.0.1:1013 send-proxy check

# Nginx direct HTTP (port 1010) - non-WS HTTP traffic
backend bk_nginx_http
    mode http
    server nginx-http 127.0.0.1:1010 send-proxy check

# SSH direct (port 2222) - raw SSH tunneling
backend bk_ssh
    mode tcp
    server ssh-direct 127.0.0.1:2222 check

# OpenVPN direct (port 1194)
backend bk_openvpn
    mode tcp
    server openvpn-direct 127.0.0.1:1194 check

# Internal redirect: HTTP -> abstract socket (HTTP handler)
backend recir_http
    mode tcp
    server loopback-for-http abns@haproxy-http send-proxy-v2 check

# Internal redirect: HTTPS/TLS -> abstract socket (SSL termination)
backend recir_https
    mode tcp
    server loopback-for-https abns@haproxy-https send-proxy-v2 check
